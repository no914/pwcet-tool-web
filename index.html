bff}.tl-event{position:absolute;top:15px;height:17px;min-width:3px;padding:0;border:1px solid var(--function-color,#2696a1);border-radius:4px;background:var(--function-color,#55b5bf)}.tl-event:hover{filter:saturate(1.12) brightness(.96)}.tl-event.active{outline:2px solid #1c2c44;outline-offset:1px;box-shadow:0 0 0 4px #ffffff;z-index:2}.tl-resource-title{background:#f8fafc;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:15px 18px;font-size:12px;font-weight:800}.tl-resource-row{min-height:74px;border-bottom:1px solid #edf1f6}.tl-resource-label{display:flex;align-items:center;gap:10px;padding:18px;border-right:1px solid var(--border);font-size:12px;font-weight:650}.tl-resource-indicator{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.tl-no-data{display:flex;align-items:center;justify-content:center;color:#9aa8ba;font-size:12px;background:repeating-linear-gradient(135deg,#fff,#fff 14px,#fafbfd 14px,#fafbfd 28px)}.tl-details{margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

<body><div id="app">Loading pWCET Tool...</div>
<script>
// Web Agent Phase 1: token is kept only in page memory, not localStorage or URL.
const localAgent = {base:'http://127.0.0.1:8765', token:'', connected:false, profiles:[], busy:false};
function agentFetch(path,options={}) {
  if(!localAgent.token) return Promise.reject(new Error('Please connect to your local agent first.'));
  const headers = new Headers(options.headers || {});
  headers.set('X-pWCET-Token',localAgent.token);
  return fetch(localAgent.base+path,{...options,headers,cache:'no-store',mode:'cors'});
}
function openLocalConnect(){connectScreen();}
async function returnToDemo(){
  localAgent.connected=false;
  localAgent.token='';
  localAgent.profiles=[];
  await loadDemo();
  state.tab='home';
  render();
}
function connectScreen(message='') {
  const node = document.getElementById('app');
  node.innerHTML = `<div style="min-height:100vh;background:#f6f9fd;padding:9vh 20px;color:#20344f;font:15px/1.6 system-ui,sans-serif">
    <div style="max-width:600px;margin:auto;background:white;border:1px solid #dce6f3;border-radius:18px;padding:32px;box-shadow:0 15px 50px #2345630b">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1 style="font-size:29px;margin:0 0 8px">Connect Local Profiler</h1><button onclick="returnToDemo()" style="padding:8px 12px;background:#f1f5f9;border:1px solid #cbd8e8;border-radius:8px;cursor:pointer">← Back to Demo</button></div>
      <p>To profile applications on <strong>this computer</strong>, first start the pWCET Tool Local Agent. This public website does not execute Python itself.</p>
      <p style="font-size:13px;color:#60718b">Local Agent URL: <code>http://127.0.0.1:8765</code></p>
      <label for="agentToken">Pairing token (printed in the Agent terminal)</label>

async function connectLocalAgent() {

async function launchProfile() {
  const id=document.getElementById('agentProfile')?.value;
  const msg=document.getElementById('captureMessage');
  if(!id){if(msg)msg.textContent='Configure a profile on the local Agent first.';return;}
  if(localAgent.busy)return;
  localAgent.busy=true;
  try{
    const r=await agentFetch('/agent/captures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:id})});
    const payload=await r.json();
    if(!r.ok)throw new Error(payload.error||`HTTP ${r.status}`);
    if(msg)msg.textContent='Capture started. Monitoring local Python process…';
    const jobId=payload.job_id;
    for(let tries=0;tries<600;tries++){
      await new Promise(resolve=>setTimeout(resolve,1000));
      const s=await agentFetch('/agent/captures/'+encodeURIComponent(jobId));
      const state=await s.json();
      if(!s.ok)throw new Error(state.error||'Job status unavailable');
      if(state.status!=='running'){
        if(msg)msg.textContent=state.status==='completed'?'Measurement complete. Refreshing Runs…':`Capture ${state.status}. Check the local Agent terminal and runs directory.`;
        if(state.status==='completed'){
          const x=await agentFetch('/api/runs');const data=await x.json();availableRuns=data.runs||[];
          if(state.run_id&&availableRuns.some(q=>q.run_id===state.run_id))await changeRun(state.run_id);
          else await refreshRunCatalog();
        }
        return;
      }
    }
    if(msg)msg.textContent='Capture is still running. Check the local Agent terminal.';
  }catch(e){if(msg)msg.textContent='Capture error: '+e.message;}finally{localAgent.busy=false;}
}

const timelinePointer={active:false,moved:false,lastX:0,width:1,accumulated:0,lastDragEnd:-Infinity};
function timelineClamp(start,span){
  const total=timelineTotal();
  const nextSpan=Math.max(Math.min(total,realTrace?.available?0.01:0.1),Math.min(total,span));
  return {start:Math.max(0,Math.min(total-nextSpan,start)),span:nextSpan};

function timelineZoomAt(factor,fraction){
  const before=timelineView.span;
  const anchor=Math.max(0,Math.min(1,fraction));
  const anchorTime=timelineView.start+anchor*before;
  const next=timelineClamp(anchorTime-anchor*before*factor,before*factor);
  timelineView.start=next.start;
  timelineView.span=next.span;
  render();
}
function timelineAreaFraction(clientX){
  const track=document.querySelector('.tl-track');
  if(!track)return 0.5;
  const r=track.getBoundingClientRect();
  if(!r.width)return 0.5;
  return Math.max(0,Math.min(1,(clientX-r.left)/r.width));

function timelineWheel(event){
  if(!event.target.closest('.tl-track, .tl-ruler'))return;
  event.preventDefault();
  if(event.shiftKey){
    const next=timelineClamp(timelineView.start+Math.sign(event.deltaY||event.deltaX)*timelineView.span*.12,timelineView.span);
    timelineView.start=next.start;render();
    return;
  }
  const dy=event.deltaY!==0?event.deltaY:event.deltaX;
  const factor=Math.exp(Math.max(-120,Math.min(120,dy))*.003);
  timelineZoomAt(factor,timelineAreaFraction(event.clientX));

function timelinePointerDown(event){
  if(event.button!==0)return;
  if(!event.target.closest('.tl-track, .tl-ruler'))return;
  timelinePointer.active=true;
  timelinePointer.moved=false;
  timelinePointer.accumulated=0;
  timelinePointer.lastX=event.clientX;
  timelinePointer.width=document.querySelector('.tl-track')?.getBoundingClientRect().width||1;
  document.querySelector('.tl-board')?.classList.add('mouse-panning');

function timelinePointerMove(event){
  if(!timelinePointer.active)return;

  timelinePointer.lastX=event.clientX;
  timelinePointer.accumulated+=dx;
  if(Math.abs(timelinePointer.accumulated)>4)timelinePointer.moved=true;
  if(!timelinePointer.moved)return;
  const next=timelineClamp(timelineView.start-dx/timelinePointer.width*timelineView.span,timelineView.span);
  timelineView.start=next.start;
  render();
}
function timelinePointerUp(){
  if(!timelinePointer.active)return;

  <div class="warning"><strong>Data scope:</strong> ${real?"Events are actual completed Python function intervals from this run. Times are relative to the earliest recorded start; they are not synchronized with external devices. CPU/GPU/memory utilization traces have not been imported.":"Legacy LAPA summaries do not include synchronized event timestamps. Event positions here are simulated."}</div>`;
}

function reportValue(v,digits=5){if(v==null)return"N/A";const n=Number(v);return Number.isFinite(n)?n.toFixed(digits):"N/A"}
function reportFlag(v){return v===true?"True":v===false?"False":"N/A"}
function reportTable(title,headers,values){return `<section><div class="report-section-title">${title}</div><div class="report-table-scroll"><table class="report-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody><tr>${values.map(v=>`<td>${esc(v==null?"N/A":v)}</td>`).join("")}</tr></tbody></table></div></section>`}
function reportChartPanel(f){const images=reportImages[f.id]||{},charts=[["gev_pdf","GEV PDF"],["cdf","EXECUTION TIME CDF"],["pdf","EXECUTION TIME PDF"],["cv","COEFFICIENT OF VARIATION"]];return `<section class="figure-section"><h2 class="section-title">Original pWCET Report Figures</h2><p class="subtitle">Original analysis figures, if present for the selected function.</p><div class="figure-grid">${charts.map(([key,title])=>{const src=images[key];return panel(title,`<div class="panel-body">${src?`<div class="figure-panel"><img src="${esc(src)}" alt="${esc(title)}" loading="lazy"></div><a class="figure-link" href="${esc(src)}" target="_blank" rel="noopener noreferrer">Open full-size figure ↗</a>`:`<div class="figure-empty">Original figure not available.</div>`}</div>`,"<span class='tag'>ORIGINAL REPORT</span>")}).join("")}</div></section>`}
function analysis(){const f=currentFunc(),r=fullReports[f.id]||{};const select=`<select class="select" onchange="selectFunction(this.value)">${funcs.map((item,index)=>`<option value="${index}" ${index===state.index?"selected":""}>${esc(fullLabel(item))}</option>`).join("")}</select>`;const rawStats=reportTable("Statistics (raw data)",["#measurements","min (ms)","avg (ms)","max (ms)","stdev","CV"],[r.num_execution_time_measurements??f.samples,reportValue(r.measurements_min_ms),reportValue(r.measurements_avg_ms??f.mean_ms),reportValue(r.measurements_max_ms??f.max_ms),reportValue(r.measurements_stdev),reportValue(r.measurements_cv)]);const blocks=reportTable("Statistics (block maxima)",["#blocks","min (ms)","avg (ms)","max (ms)","stdev","CV"],[r.num_blocks??f.block_maxima_count,reportValue(r.block_maxima_min_ms),reportValue(r.block_maxima_avg_ms),reportValue(r.block_maxima_max_ms),reportValue(r.block_maxima_stdev),reportValue(r.block_maxima_cv)]);const rawGEV=reportTable(`GEV (raw data), IID: ${reportFlag(r.raw_is_iid??f.raw_is_iid)}`,["shape","location","scale"],[reportValue(r.raw_gev_shape,9),reportValue(r.raw_gev_loc,9),reportValue(r.raw_gev_scale,9)]);const ppfNames=["PPF 95%","PPF 99%","PPF 99.6%","PPF 99.9%","PPF 99.99%","PPF 99.999%"];const rawP=reportTable("pWCET (raw data)",ppfNames,[r.raw_ppf_95,r.raw_ppf_99,r.raw_ppf_99_6??f.raw_ppf_99_6_ms,r.raw_ppf_99_9,r.raw_ppf_99_99,r.raw_ppf_99_999].map(x=>reportValue(x)));const iGEV=reportTable(`GEV (IESTA), IID: ${reportFlag(r.iesta_is_iid??f.iesta_is_iid)}`,["shape","location","scale"],[reportValue(r.iesta_gev_shape,9),reportValue(r.iesta_gev_loc,9),reportValue(r.iesta_gev_scale,9)]);const iP=reportTable("pWCET (IESTA)",ppfNames,[r.iesta_ppf_95,r.iesta_ppf_99,r.iesta_ppf_99_6??f.iesta_ppf_99_6_ms,r.iesta_ppf_99_9,r.iesta_ppf_99_99,r.iesta_ppf_99_999].map(x=>reportValue(x)));const ks=r.kstest_pvalue??f.ks_pvalue;const scaleIssue=["letterbox","compose_vertical_letterbox"].includes(f.name);return `${pageHeader("pWCET Analysis","Statistical analysis results from the original LAPA reports.",select)}<div class="report-document"><div class="report-function-name">${esc(f.full_name||f.id)}</div>${rawStats}${blocks}${rawGEV}${rawP}<div class="report-test"><strong>Kolmogorov–Smirnov Test</strong><span style="margin-left:18px">p-value = ${reportValue(ks,6)}</span><p>GEV goodness-of-fit diagnostic. Review the original report's assumptions and methodology.</p></div>${iGEV}${iP}${scaleIssue?`<div class="warning"><strong>Known IESTA scale issue:</strong> This function has a previously identified relative/absolute timing scale inconsistency. Its IESTA PPF requires review.</div>`:""}</div>${reportChartPanel(f)}<div class="warning">Values come from the original LAPA reports where available. Missing fields are shown as N/A. Statistical validity must be reviewed per function; functions originate from separate campaigns.</div>`}
function makeFindings(){const findings=[];funcs.forEach((f,index)=>{if(f.ks_pvalue!=null&&f.ks_pvalue<0.05)findings.push({level:"yellow",category:"Statistical Review",title:"Low reported KS p-value",detail:"Reported KS p-value: "+num(f.ks_pvalue)+". Review model fit and assumptions.",index});if(f.raw_is_iid===false)findings.push({level:"yellow",category:"IID Assessment",title:"Raw IID flagged false",detail:"The report recorded raw_is_iid=false. Further review is recommended.",index});if(["letterbox","compose_vertical_letterbox"].includes(f.name))findings.push({level:"yellow",category:"Output Interpretation",title:"IESTA scale inconsistency",detail:"Possible relative/absolute timing-scale interpretation issue.",index})});["CPU / Compute","Memory","I/O / Blocking"].forEach(category=>findings.push({level:"gray",category,title:"Evidence unavailable",detail:"Resource-level evidence unavailable in the current LAPA dataset.",index:0}));return findings}
function diagnosis(){const findings=makeFindings(),active=findings[state.finding]||findings[0],review=findings.filter(f=>f.level==="yellow").length,na=findings.filter(f=>f.level==="gray").length;const rows=findings.map((item,i)=>`<tr><td><span class="status-dot ${item.level}"></span>${item.level==="yellow"?"Review":"N/A"}</td><td>${esc(item.category)}</td><td>${esc(item.title)}</td><td>${esc(displayName(funcs[item.index]))}</td><td><button class="link" onclick="state.finding=${i};render()">Inspect →</button></td></tr>`).join("");return `${pageHeader("Diagnosis Results","Evidence-based statistical review indicators.")}<div class="metrics">${metric("Review Items",review,"Statistical review")}${metric("N/A Categories",na,"Missing evidence")}${metric("Functions",funcs.length,"LAPA targets")}${metric("Rule Status","DEMO","Thresholds not finalized")}</div>${panel("DIAGNOSTIC FINDINGS",`<div class="table-wrap"><table class="data-table"><thead><tr><th>Status</th><th>Category</th><th>Finding</th><th>Function</th><th>Evidence</th></tr></thead><tbody>${rows}</tbody></table></div>`)}<div class="diagnosis-detail"><h3>${esc(active.title)}</h3><p>${esc(active.detail)}</p><p><strong>Function:</strong> ${esc(fullLabel(funcs[active.index]))}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="openAnalysis(${active.index})">View pWCET Evidence →</button><button class="btn secondary" onclick="openTimeline(${active.index})">View Timeline →</button></div></div><div class="warning">These are statistical review prompts, not confirmed root causes. N/A means evidence is unavailable.</div>`}
function infoPanel(title,rows){return panel(title,`<div class="panel-body">${rows.map(([k,v])=>`<div class="info-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}</div>`)}
function system(){const groups=[...new Set(funcs.map(groupName))],total=funcs.reduce((a,f)=>a+Number(f.samples||0),0);return `${pageHeader("System Information","Selected measurement dataset and analysis metadata.")}<div class="info-grid">${infoPanel("DATASET",[["Application",availableRuns.find(r=>r.run_id===activeRunId)?.application||"LAPA sample"],["Language","Python"],["Functions",String(funcs.length)],["Reported Samples",total.toLocaleString()],["Source","Original profiler reports"],["Campaign Scope","Merged across runs"]])}${infoPanel("ANALYSIS METADATA",[["Block Maxima","Per-function values"],["pWCET","Raw / IESTA PPF"],["Fit Diagnostic","KS p-value"],["IID Indicator","Raw / IESTA"],["Observed P99","Not included"],["Timeline","Simulated"]])}${infoPanel("CAMPAIGN GROUPS",groups.map(g=>[g,funcs.filter(f=>groupName(f)===g).length+" functions"]))}${infoPanel("PLATFORM",[["Operating System","Not included"],["CPU","Not included"],["GPU","Not included"],["Profiler Config","Not included"],["Raw Traces","Not imported"],["Original Figures","Imported when available"]])}</div>`}
function appShell(){const tabs=[["home","Home","⌂"],["timeline","Timeline / Function","⌁"],["analysis","pWCET Analysis","▥"],["diagnosis","Diagnosis","◇"],["system","System Info","▤"]],current=tabs.find(t=>t[0]===state.tab);const pages={timeline,analysis,diagnosis,system};return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-icon">⌁</div><div><div class="brand-name">pWCET Tool</div><div class="brand-subtitle">TIMING ANALYSIS</div></div></div><div><div class="nav-title">WORKSPACE</div><div class="nav">${tabs.map(([id,label,symbol])=>`<button class="${state.tab===id?"active":""}" onclick="nav('${id}')"><span class="nav-symbol">${symbol}</span>${label}</button>`).join("")}</div></div><div class="sidebar-status"><strong>${usingBackend?'LOCAL PROFILER CONNECTED':'DEMO MODE · SAMPLE DATA'}</strong><p>${usingBackend?'Recorded function timing from this computer.':'LAPA summaries · illustrative timeline, not a synchronized trace.'}</p></div></aside><div class="main"><header class="topbar"><span>Workspace / <strong>${current[1]}</strong></span><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${usingBackend?`<select class="select" style="min-width:190px;max-width:360px;padding:7px" aria-label="Select analysis run" onchange="changeRun(this.value)">${availableRuns.map(r=>`<option value="${esc(r.run_id)}" ${r.run_id===activeRunId?"selected":""}>${esc(r.label)} (${r.function_count})</option>`).join("")}</select>`:""}<span class="top-badge">● ${funcs.length} FUNCTIONS${usingBackend?" · LOCAL AGENT":" · DEMO"}</span><button class="btn secondary" style="padding:8px 11px" onclick="${usingBackend?'returnToDemo()':'openLocalConnect()'}">${usingBackend?'Disconnect · Demo':'Connect Local Profiler'}</button></div></header><main class="content">${pages[state.tab]()}<div class="footer">pWCET Tool · Research prototype · Recorded function intervals for compatible CLI runs · Legacy summaries use simulated events</div></main></div></div>`}
function render(){if(state.tab==="home"){$("app").innerHTML=home();return}if(!funcs.length){$("app").innerHTML=`<div class="error"><h2>Demo data unavailable</h2><p>The public demo requires lapa_demo.json beside index.html.</p><button class="btn" onclick="nav('home')">Back to Home</button></div>`;return}$("app").innerHTML=appShell();if(state.tab==="timeline")installTimelineMouseHandlers()}
async function loadOptionalJSON(filename){try{const res=await fetch(filename,{cache:"no-store"});if(!res.ok){console.warn(filename+" unavailable (HTTP "+res.status+")");return{}}return await res.json()}catch(e){console.warn("Could not load "+filename,e);return{}}}
async function changeRun(runId){
  if(!usingBackend)return;
  const chosen=availableRuns.find(r=>r.run_id===runId);
  if(!chosen)return;
  try{
    const response=await agentFetch(`/api/runs/${encodeURIComponent(runId)}`,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    funcs=Array.isArray(data.functions)?data.functions:[];
    fullReports=data.full_reports||{};
    reportImages=data.images||{};
    activeRunId=runId;
    realTrace=null;
    try {
      const er=await agentFetch(`/api/runs/${encodeURIComponent(runId)}/events`,{cache:"no-store"});
      if(er.ok){const payload=await er.json();if(payload.available)realTrace=payload;}
    } catch(e) {console.warn("Recorded events unavailable",e)}
    timelineView.start=0;timelineView.span=realTrace?.duration_ms||10;
    state.index=0;state.event=0;state.finding=0;
    render();
  }catch(error){console.error("Could not switch run",error);alert("Could not load run: "+error.message)}
}
async function initialize(){
  if(!localAgent.connected){await loadDemo();render();return;}
  // Prefer the live, same-origin Python API; keep static JSON as a fallback.
  try{
    const res=await agentFetch("/api/runs",{cache:"no-store"});
    if(!res.ok)throw new Error("API unavailable");
    const payload=await res.json();
    availableRuns=Array.isArray(payload.runs)?payload.runs:[];
    if(!availableRuns.length)throw new Error("No runs in backend");
    usingBackend=true;
    // Merged view is explicitly marked as a demo aggregation, not a synchronized run.
    await changeRun((availableRuns.find(r=>r.run_id.startsWith("capture-"))||availableRuns[0]).run_id);
    console.log("pWCET Tool API connected:",availableRuns.length,"views");
    return;
  }catch(error){
    usingBackend=false;
    console.info("pWCET Tool API not available, falling back to static JSON:",error.message);
  }
  await loadDemo();
  render();
}
async function loadDemo(){
  usingBackend=false;
  realTrace=null;
  availableRuns=[];
  activeRunId=null;
  try{
    const data=await loadOptionalJSON("./lapa_demo.json");
    funcs=Array.isArray(data.functions)?data.functions:[];
    const [reports,images]=await Promise.all([
      loadOptionalJSON("./lapa_full_report.json"),
      loadOptionalJSON("./lapa_images.json")
    ]);
    fullReports=reports;
    reportImages=images;
    const idx=funcs.findIndex(f=>f.name==="predict_action");
    state.index=idx>=0?idx:0;
    state.event=0;
    state.finding=0;
    timelineView.start=0;timelineView.span=10;
    console.log("pWCET Tool Demo Mode:",funcs.length,"functions");
  }catch(error){console.error(error)}
}
initialize();
</script>
